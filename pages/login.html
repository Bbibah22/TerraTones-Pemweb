<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Masuk — LokalBeat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#ff5e3a',dark:'#e04a28'},surface:{card:'#16161f'}}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body{background:#0a0a0f;color:#f0f0f5;font-family:'DM Sans',sans-serif;}
    h1,h2,h3{font-family:'Syne',sans-serif;}
    .glow{box-shadow:0 0 40px rgba(255,94,58,0.2);}
    input:focus{outline:none;}
    .bg-hero{background:radial-gradient(ellipse 60% 60% at 50% 0%,rgba(255,94,58,0.12) 0%,transparent 70%),#0a0a0f;}
    .toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;transform:translateX(120%);transition:transform 0.3s ease;}
    .toast.show{transform:translateX(0);}
    .toast.error{background:#ef4444;color:white;}
    .toast.success{background:#22c55e;color:white;}
  </style>
</head>
<body class="bg-hero min-h-screen flex items-center justify-center px-4">

  <div id="toast" class="toast"></div>

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-brand flex items-center justify-center glow">
          <i class="fa-solid fa-music text-white"></i>
        </div>
        <span class="font-heading text-2xl font-bold text-white">Lokal<span class="text-brand">Beat</span></span>
      </a>
      <h2 class="text-2xl font-bold text-white">Selamat Datang Kembali</h2>
      <p class="text-gray-400 text-sm mt-1">Masuk untuk melanjutkan perjalanan musikmu</p>
    </div>

    <!-- CARD -->
    <div class="bg-[#16161f] border border-[#222230] rounded-3xl p-8">
      <!-- Role tabs -->
      <div class="flex gap-2 mb-6 p-1 bg-black/30 rounded-xl">
        <button onclick="setRole('user')" id="tab-user" class="flex-1 py-2 rounded-lg text-sm font-semibold transition role-tab active-tab">🎧 Pendengar</button>
        <button onclick="setRole('musisi')" id="tab-musisi" class="flex-1 py-2 rounded-lg text-sm font-semibold transition role-tab">🎸 Musisi</button>
        <button onclick="setRole('admin')" id="tab-admin" class="flex-1 py-2 rounded-lg text-sm font-semibold transition role-tab">🛡️ Admin</button>
      </div>

      <style>
        .role-tab{color:#888;background:transparent;}
        .active-tab{background:#ff5e3a;color:white;}
      </style>

      <!-- Hint -->
      <div id="loginHint" class="bg-blue-500/10 border border-blue-500/20 rounded-xl p-3 mb-5 text-xs text-blue-300">
        <i class="fa-solid fa-circle-info mr-1"></i>
        <span id="hintText">Demo: budi@mail.com / user123</span>
      </div>

      <!-- Form -->
      <div class="space-y-4">
        <div>
          <label class="text-xs text-gray-400 mb-1.5 block">Email</label>
          <input id="email" type="email" placeholder="email@contoh.com"
            class="w-full bg-black/30 border border-[#222230] focus:border-brand rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 transition"/>
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-1.5 block">Password</label>
          <div class="relative">
            <input id="password" type="password" placeholder="••••••••"
              class="w-full bg-black/30 border border-[#222230] focus:border-brand rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 transition pr-12"/>
            <button onclick="togglePass()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition">
              <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button onclick="doLogin()" class="w-full bg-brand hover:bg-brand-dark text-white font-semibold py-3.5 rounded-xl transition mt-2 flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk
        </button>
      </div>

      <p class="text-center text-sm text-gray-500 mt-6">
        Belum punya akun?
        <a href="register.html" class="text-brand hover:underline font-semibold">Daftar sekarang</a>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
