<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daftar — LokalBeat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#ff5e3a',dark:'#e04a28'}}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body{background:#0a0a0f;color:#f0f0f5;font-family:'DM Sans',sans-serif;}
    h1,h2,h3{font-family:'Syne',sans-serif;}
    .glow{box-shadow:0 0 40px rgba(255,94,58,0.2);}
    input:focus,select:focus,textarea:focus{outline:none;}
    .bg-hero{background:radial-gradient(ellipse 60% 60% at 50% 0%,rgba(255,94,58,0.12) 0%,transparent 70%),#0a0a0f;}
    .toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;transform:translateX(120%);transition:transform 0.3s ease;}
    .toast.show{transform:translateX(0);}
    .toast.error{background:#ef4444;color:white;}
    .toast.success{background:#22c55e;color:white;}
    .role-card{cursor:pointer;border:2px solid transparent;transition:all 0.2s;}
    .role-card:hover{border-color:#ff5e3a44;}
    .role-card.selected{border-color:#ff5e3a;background:rgba(255,94,58,0.08);}
  </style>
</head>
<body class="bg-hero min-h-screen flex items-center justify-center px-4 py-10">

  <div id="toast" class="toast"></div>

  <div class="w-full max-w-lg">
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-brand flex items-center justify-center glow">
          <i class="fa-solid fa-music text-white"></i>
        </div>
        <span style="font-family:Syne" class="text-2xl font-bold text-white">Lokal<span class="text-brand">Beat</span></span>
      </a>
      <h2 class="text-2xl font-bold text-white">Buat Akun Baru</h2>
      <p class="text-gray-400 text-sm mt-1">Bergabung dengan komunitas musik lokal Indonesia</p>
    </div>

    <div class="bg-[#16161f] border border-[#222230] rounded-3xl p-8">

      <!-- Step 1: Pilih Role -->
      <div id="step1">
        <p class="text-sm text-gray-400 mb-4 font-semibold">Pilih peranmu:</p>
        <div class="grid grid-cols-2 gap-3 mb-6">
          <div class="role-card bg-black/20 rounded-2xl p-5 text-center" onclick="selectRole('user')" id="card-user">
            <div class="text-3xl mb-2">🎧</div>
            <div class="font-semibold text-white text-sm" style="font-family:Syne">Pendengar</div>
            <div class="text-xs text-gray-500 mt-1">Nikmati musik lokal</div>
          </div>
          <div class="role-card bg-black/20 rounded-2xl p-5 text-center" onclick="selectRole('musisi')" id="card-musisi">
            <div class="text-3xl mb-2">🎸</div>
            <div class="font-semibold text-white text-sm" style="font-family:Syne">Musisi</div>
            <div class="text-xs text-gray-500 mt-1">Upload & jual musik</div>
          </div>
        </div>
        <button onclick="nextStep()" class="w-full bg-brand hover:bg-brand-dark text-white font-semibold py-3.5 rounded-xl transition">
          Lanjutkan <i class="fa-solid fa-arrow-right ml-1"></i>
        </button>
      </div>

      <!-- Step 2: Form Data -->
      <div id="step2" class="hidden">
        <button onclick="prevStep()" class="flex items-center gap-2 text-sm text-gray-400 hover:text-white transition mb-5">
          <i class="fa-solid fa-arrow-left"></i> Kembali
        </button>

        <div class="space-y-4">
          <div>
            <label class="text-xs text-gray-400 mb-1.5 block">Nama Lengkap</label>
            <input id="reg-name" type="text" placeholder="Nama kamu"
              class="w-full bg-black/30 border border-[#222230] focus:border-brand rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 transition"/>
          </div>
          <div>
            <label class="text-xs text-gray-400 mb-1.5 block">Email</label>
            <input id="reg-email" type="email" placeholder="email@contoh.com"
              class="w-full bg-black/30 border border-[#222230] focus:border-brand rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 transition"/>
          </div>
          <div>
            <label class="text-xs text-gray-400 mb-1.5 block">Password</label>
            <input id="reg-pass" type="password" placeholder="Min 6 karakter"
              class="w-full bg-black/30 border border-[#222230] focus:border-brand rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 transition"/>
          </div>

          <!-- Extra fields for musisi -->
          <div id="musisiFields" class="hidden space-y-4">
            <div>
              <label class="text-xs text-gray-400 mb-1.5 block">Nama Panggung / Band</label>
              <input id="reg-stagename" type="text" placeholder="Nama musisimu"
                class="w-full bg-black/30 border border-[#222230] focus:border-brand rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 transition"/>
            </div>
            <div>
              <label class="text-xs text-gray-400 mb-1.5 block">Genre Utama</label>
              <select id="reg-genre" class="w-full bg-black/30 border border-[#222230] focus:border-brand rounded-xl px-4 py-3 text-sm text-white transition">
                <option value="">Pilih genre...</option>
                <option>Indie Folk</option><option>Jazz Lokal</option><option>Pop Alternatif</option>
                <option>R&B Lokal</option><option>Dangdut Modern</option><option>Keroncong</option>
                <option>Hip-Hop Lokal</option><option>Elektronik</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-gray-400 mb-1.5 block">Kota Asal</label>
              <input id="reg-kota" type="text" placeholder="Jakarta, Bandung, Yogyakarta..."
                class="w-full bg-black/30 border border-[#222230] focus:border-brand rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 transition"/>
            </div>
          </div>

          <button onclick="doRegister()" class="w-full bg-brand hover:bg-brand-dark text-white font-semibold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-user-plus"></i> Buat Akun
          </button>
        </div>

        <p class="text-center text-sm text-gray-500 mt-5">
          Sudah punya akun? <a href="login.html" class="text-brand hover:underline font-semibold">Masuk</a>
        </p>
      </div>

    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
